server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: arooraa-aura-service
  datasource:
    url: ${AURA_DB_URL}
    username: ${AURA_DB_USERNAME}
    password: ${AURA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

aura:
  bootstrap:
    # Loads AROORAA's approved public corpus into this database through the normal
    # import → approve → chunk → embed → activate pipeline (see PublicKnowledgeBootstrap).
    # Off by default: loading knowledge is a deliberate operator action, and there is no HTTP
    # equivalent anywhere in this service. Idempotent — rerunning it changes nothing.
    public-knowledge: ${AURA_BOOTSTRAP_PUBLIC_KNOWLEDGE:false}
    source-directory: ${AURA_BOOTSTRAP_SOURCE_DIR:knowledge-seed}
    # Running the bootstrap IS the approval action; this is who it is recorded against.
    approved-by: ${AURA_BOOTSTRAP_APPROVED_BY:local-bootstrap@arooraa.com}
    # Shut down once loading finishes, so the bootstrap can be a one-shot command rather than a
    # server that happens to have indexed something.
    exit-after-bootstrap: ${AURA_BOOTSTRAP_EXIT_AFTER:false}
  # Cross-origin access to the chat API. Empty by default, which registers no CORS
  # configuration at all — a deployment that never sets this stays closed to every other origin.
  # Only for local frontend development, and only ever an exact list; there is no wildcard branch.
  # The preferred local answer needs nothing here: frontend-v2's dev rewrite proxies /api/aura/*
  # to this service server-side, so the browser only ever makes a same-origin request.
  cors:
    allowed-origins: ${AURA_CORS_ALLOWED_ORIGINS:}
  chat:
    # The local chat API (/api/v1/aura/**) and manual test page (/aura-test) only exist when this
    # is true — the controllers are conditional, so with it off the routes 404 rather than being
    # merely unadvertised. A3 is a local manual-acceptance milestone: public exposure is a separate,
    # later decision.
    enabled: ${AURA_CHAT_ENABLED:false}
    # Developer diagnostics (mode, evidence level, language, tone, latency) on each response.
    # Separate switch from `enabled` so a shared local run can expose chat without internals.
    diagnostics-enabled: ${AURA_CHAT_DIAGNOSTICS_ENABLED:false}
    # Bounded session memory: the last N turns, also capped by total characters so a few very long
    # turns can't grow the prompt the way many short ones can't.
    max-history-messages: ${AURA_CHAT_MAX_HISTORY_MESSAGES:12}
    max-history-chars: ${AURA_CHAT_MAX_HISTORY_CHARS:6000}
    # Hard ceiling on an answer, enforced after generation by the output guardrail.
    max-response-chars: ${AURA_CHAT_MAX_RESPONSE_CHARS:2000}
    max-sources: ${AURA_CHAT_MAX_SOURCES:3}
    # Warm enough to sound human, low enough to stay on the evidence.
    temperature: ${AURA_CHAT_TEMPERATURE:0.6}
    max-output-tokens: ${AURA_CHAT_MAX_OUTPUT_TOKENS:600}
  provider:
    chat:
      enabled: ${AURA_CHAT_PROVIDER_ENABLED:false}
      # Same config-driven adapter selection as embeddings — never a code branch.
      provider: ${AURA_CHAT_PROVIDER:openai}
      model: ${AURA_CHAT_MODEL:gpt-4o-mini}
      timeout-seconds: ${AURA_CHAT_PROVIDER_TIMEOUT_SECONDS:30}
    embedding:
      enabled: ${AURA_EMBEDDING_PROVIDER_ENABLED:false}
      # Selects which real adapter to wire when enabled — config-driven, never a code branch.
      # A2 ships exactly one real adapter (see OpenAiEmbeddingProvider). The API key itself is
      # read directly from OPENAI_API_KEY, never stored on this properties object.
      provider: ${AURA_EMBEDDING_PROVIDER:openai}
      model: ${AURA_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${AURA_EMBEDDING_DIMENSIONS:1536}
      # AURA_EMBEDDING_PROVIDER_TIMEOUT_SECONDS keeps the existing A0/A1 per-provider naming
      # convention (matching aura.provider.chat/.reranking below) rather than the milestone
      # brief's generic AURA_PROVIDER_TIMEOUT suggestion, which the brief itself allows
      # ("exact names may follow repository conventions").
      timeout-seconds: ${AURA_EMBEDDING_PROVIDER_TIMEOUT_SECONDS:30}
      # The vector cohort ingestion writes and retrieval searches. Bump this (and re-embed) when
      # the provider, model or dimension changes — never mix cohorts in one similarity search.
      # Generation 1 = A2's development vectors; 2 = the real-provider calibration cohort.
      generation: ${AURA_EMBEDDING_GENERATION:1}
    reranking:
      enabled: ${AURA_RERANKING_PROVIDER_ENABLED:false}
      model: ${AURA_RERANKING_MODEL:}
      timeout-seconds: ${AURA_RERANKING_PROVIDER_TIMEOUT_SECONDS:30}
  safety:
    # No chat endpoint exists yet — this is a represented, not-yet-consumed-by-a-controller
    # config surface so a future chat endpoint doesn't invent its own ad hoc limit. A2's
    # retrieval path (HybridRetrievalService) does already consume raw-prompt-logging-enabled.
    max-input-chars: ${AURA_MAX_INPUT_CHARS:4000}
    # Never log full prompts/responses in production; off by default even in local dev.
    raw-prompt-logging-enabled: ${AURA_RAW_PROMPT_LOGGING_ENABLED:false}
  ingestion:
    chunking:
      # Frozen A2 requirement: configurable target chunk size and overlap, not hardcoded.
      target-chars: ${AURA_CHUNK_TARGET_CHARS:1000}
      overlap-chars: ${AURA_CHUNK_OVERLAP_CHARS:150}
  retrieval:
    # How many raw hits each of vector/lexical search pulls before RRF fusion trims to result-limit.
    candidate-limit: ${AURA_RETRIEVAL_CANDIDATE_LIMIT:20}
    result-limit: ${AURA_RETRIEVAL_RESULT_LIMIT:8}
    # Reciprocal Rank Fusion constant — the standard default (Cormack et al.); not tuned for this
    # corpus yet.
    rrf-k: ${AURA_RETRIEVAL_RRF_K:60}
    evidence:
      # ABSOLUTE relevance thresholds (A2.1), compared against raw cosine similarity and query-term
      # coverage — never against an RRF score, which only reflects rank and so rated every query on
      # a small corpus as "best available" = confident (the A2 defect).
      #
      # A2.2 replaced A2.1's provisional guesses with values measured against the real provider
      # (text-embedding-3-small, generation 2) over the approved corpus, via EmbeddingCalibrationIT:
      #
      #   positive set (n=10):  min 0.583  median 0.679  mean 0.661  max 0.740
      #   unrelated set (n=6):  min 0.042  median 0.136  mean 0.139  max 0.275
      #
      # strong = 0.58 sits just under the lowest true positive (0.583, "What is MESA?") so every
      # measured positive clears it, and more than twice the highest unrelated score.
      # weak = 0.30 sits just above the highest unrelated score (0.275, "What is today's weather?"),
      # which is the case A2.2 had to fix: below this floor the result is NO_EVIDENCE regardless of
      # lexical coverage. The 0.275..0.583 gap is empty in both measured sets — thresholds placed at
      # its edges, not in the middle, because the two errors are not symmetric: a false STRONG
      # invents an AROORAA fact, a false NO_EVIDENCE only declines to answer.
      strong-vector-similarity: ${AURA_EVIDENCE_STRONG_VECTOR_SIMILARITY:0.58}
      weak-vector-similarity: ${AURA_EVIDENCE_WEAK_VECTOR_SIMILARITY:0.30}
      # Fraction of the question's meaningful words present in the evidence text. Corroborating
      # only: a near-exact lexical match can lift a medium-similarity result to STRONG, but no
      # coverage value can lift a result below weak-vector-similarity.
      strong-query-term-coverage: ${AURA_EVIDENCE_STRONG_QUERY_TERM_COVERAGE:0.75}
      weak-query-term-coverage: ${AURA_EVIDENCE_WEAK_QUERY_TERM_COVERAGE:0.40}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.arooraa.aura: INFO
