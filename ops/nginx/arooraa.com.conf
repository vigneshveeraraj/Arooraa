# AROORAA — HTTPS via Cloudflare Origin CA. DNS has not been cut over yet; this is
# reachable directly by IP with an explicit Host header/SNI for pre-cutover validation.

server {
    listen 80;
    listen [::]:80;
    server_name arooraa.com www.arooraa.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (this host's installed version) predates the newer `http2 on;`
    # directive — using the older combined `listen ... ssl http2;` form instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arooraa.com www.arooraa.com;

    ssl_certificate /etc/ssl/cloudflare/arooraa-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/arooraa-origin.key;

    root /var/www/arooraa;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Public lead-submission endpoints -> backend's /api/v1/** (unauthenticated, backend
    # enforces its own rate limiting/duplicate detection/CSRF-exemption).
    location /api/leads/ {
        proxy_pass http://127.0.0.1:8090/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Admin API -> backend's /api/v1/admin/** (session+CSRF protected by the backend).
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8090/api/v1/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Deliberately no location for /actuator/** — not proxied publicly at all. Health is
    # checked directly against 127.0.0.1:8090 from the host, not through the public site.

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }
}
