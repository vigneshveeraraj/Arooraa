server:
  port: ${SERVER_PORT:8090}
  # Behind Nginx terminating TLS, the raw connection to this app is plain HTTP — without
  # this, request.isSecure()/getScheme() read as insecure regardless of the real client
  # protocol, which affects Spring Security's own secure-cookie derivation (e.g. the CSRF
  # cookie, whose Secure attribute defaults from request.isSecure() when not explicit).
  # ForwardedHeaderFilter only rewrites scheme/host/port from X-Forwarded-*, not the peer
  # address, so it doesn't interact with ClientIpResolver's own trusted-proxy IP logic.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${AROORAA_ADMIN_COOKIE_SECURE:false}
        same-site: lax
    multipart:
      # A hard backstop above the real business limit (arooraa.recruitment.resume.max-size-bytes,
      # 5MB by default) — requests over THIS get Spring's own generic rejection; requests between
      # the two get ResumeValidator's friendlier field-safe error instead (W3.3B §7).
      max-file-size: 8MB
      max-request-size: 10MB

spring:
  application:
    name: arooraa-lead-service
  datasource:
    url: ${AROORAA_DB_URL}
    username: ${AROORAA_DB_USERNAME}
    password: ${AROORAA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

arooraa:
  ip-hash-secret: ${AROORAA_IP_HASH_SECRET}
  trusted-proxies: ${AROORAA_TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${AROORAA_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    max-requests: ${AROORAA_RATE_LIMIT_MAX_REQUESTS:5}
    window-minutes: ${AROORAA_RATE_LIMIT_WINDOW_MINUTES:10}
  duplicate:
    window-minutes: ${AROORAA_DUPLICATE_WINDOW_MINUTES:5}
  project-enquiry:
    duplicate:
      window-minutes: ${AROORAA_PROJECT_ENQUIRY_DUPLICATE_WINDOW_MINUTES:5}
    rate-limit:
      max-requests: ${AROORAA_PROJECT_ENQUIRY_RATE_LIMIT_MAX_REQUESTS:5}
      window-minutes: ${AROORAA_PROJECT_ENQUIRY_RATE_LIMIT_WINDOW_MINUTES:10}
  lead-notifications:
    enabled: ${AROORAA_LEAD_NOTIFICATIONS_ENABLED:false}
    mail-from: ${AROORAA_MAIL_FROM:}
    mail-from-display-name: ${AROORAA_MAIL_FROM_DISPLAY_NAME:AROORAA}
    mail-reply-to: ${AROORAA_MAIL_REPLY_TO:}
    sales-notification-to: ${AROORAA_SALES_NOTIFICATION_TO:}
    worker:
      cadence-seconds: ${AROORAA_LEAD_NOTIFICATIONS_CADENCE_SECONDS:10}
      batch-size: ${AROORAA_LEAD_NOTIFICATIONS_BATCH_SIZE:20}
  # Recruitment (Milestone W3.3B) — Careers applications + talent-community subscriptions.
  # Independent rate limiting/config from every other public endpoint (project enquiries, demo
  # requests): applying to a role must never count against, or be limited by, that traffic.
  recruitment:
    resume:
      # Outside the web root and never served by Nginx — see FilesystemResumeStorage and
      # docs/recruitment-resume-storage.md. Default is a relative local-dev path; production
      # MUST set AROORAA_RECRUITMENT_RESUME_STORAGE_DIR explicitly (see docker-compose.prod.yml).
      storage-dir: ${AROORAA_RECRUITMENT_RESUME_STORAGE_DIR:./data/recruitment-resumes}
      max-size-bytes: ${AROORAA_RECRUITMENT_RESUME_MAX_SIZE_BYTES:5242880}
    rate-limit:
      max-requests: ${AROORAA_RECRUITMENT_RATE_LIMIT_MAX_REQUESTS:5}
      window-minutes: ${AROORAA_RECRUITMENT_RATE_LIMIT_WINDOW_MINUTES:10}
    talent-community:
      rate-limit:
        max-requests: ${AROORAA_RECRUITMENT_TALENT_RATE_LIMIT_MAX_REQUESTS:5}
        window-minutes: ${AROORAA_RECRUITMENT_TALENT_RATE_LIMIT_WINDOW_MINUTES:10}
  # Independent enable flag from lead-notifications (W3.3B §14) — recruitment email can be
  # turned on/off without affecting sales lead email. Shares the same underlying SMTP
  # (spring.mail.*) transport when both are enabled — see RecruitmentNotificationMailConfig.
  recruitment-notifications:
    enabled: ${AROORAA_RECRUITMENT_NOTIFICATIONS_ENABLED:false}
    mail-from: ${AROORAA_RECRUITMENT_MAIL_FROM:}
    mail-from-display-name: ${AROORAA_RECRUITMENT_MAIL_FROM_DISPLAY_NAME:AROORAA Careers}
    recruitment-alert-to: ${AROORAA_RECRUITMENT_ALERT_TO:}
    worker:
      cadence-seconds: ${AROORAA_RECRUITMENT_NOTIFICATIONS_CADENCE_SECONDS:10}
      batch-size: ${AROORAA_RECRUITMENT_NOTIFICATIONS_BATCH_SIZE:20}
  # Contact (Milestone W3.4) — general "contact AROORAA about something else" channel.
  # Independent rate limiting from every other public endpoint.
  contact:
    rate-limit:
      max-requests: ${AROORAA_CONTACT_RATE_LIMIT_MAX_REQUESTS:5}
      window-minutes: ${AROORAA_CONTACT_RATE_LIMIT_WINDOW_MINUTES:10}
  # Independent enable flag from lead/recruitment notifications — Contact email can go live
  # without affecting either. Shares the same underlying SMTP (spring.mail.*) transport.
  contact-notifications:
    enabled: ${AROORAA_CONTACT_NOTIFICATIONS_ENABLED:false}
    mail-from: ${AROORAA_CONTACT_MAIL_FROM:}
    mail-from-display-name: ${AROORAA_CONTACT_MAIL_FROM_DISPLAY_NAME:AROORAA}
    contact-alert-to: ${AROORAA_CONTACT_ALERT_TO:}
    worker:
      cadence-seconds: ${AROORAA_CONTACT_NOTIFICATIONS_CADENCE_SECONDS:10}
      batch-size: ${AROORAA_CONTACT_NOTIFICATIONS_BATCH_SIZE:20}
  # Low-friction consultation form (POST /api/v1/lead-captures, frontend-v2/docs/lead-capture.md).
  # Independent rate limiting from every other public endpoint. enabled=false answers 404.
  lead-capture:
    enabled: ${AROORAA_LEAD_CAPTURE_ENABLED:true}
    rate-limit:
      max-requests: ${AROORAA_LEAD_CAPTURE_RATE_LIMIT_MAX_REQUESTS:5}
      window-minutes: ${AROORAA_LEAD_CAPTURE_RATE_LIMIT_WINDOW_MINUTES:10}
  # The scripted bilingual lead conversation. Driven by the WhatsApp transport below (off by
  # default) or, locally, by this simulator: off by default, and also refused unless a token of
  # 24+ characters is set and sent as X-Simulator-Token. Never enable the simulator in production.
  lead-conversation:
    simulator:
      enabled: ${AROORAA_LEAD_CONVERSATION_SIMULATOR_ENABLED:false}
      token: ${AROORAA_LEAD_CONVERSATION_SIMULATOR_TOKEN:}
  # Optional local model that helps *understand* replies the deterministic rules can't place.
  # It only picks from a closed set and never writes a customer-facing message. provider "none"
  # (default) = rules only; "ollama" = a local Ollama at base-url. Any failure, timeout or
  # out-of-range answer falls back to the rules.
  lead-assistant:
    model:
      provider: ${AROORAA_LEAD_ASSISTANT_MODEL_PROVIDER:none}
      base-url: ${AROORAA_LEAD_ASSISTANT_MODEL_BASE_URL:http://localhost:11434}
      name: ${AROORAA_LEAD_ASSISTANT_MODEL_NAME:qwen3-vl:4b-instruct}
      fallback-name: ${AROORAA_LEAD_ASSISTANT_MODEL_FALLBACK_NAME:}
      connect-timeout-ms: ${AROORAA_LEAD_ASSISTANT_MODEL_CONNECT_TIMEOUT_MS:1000}
      timeout-ms: ${AROORAA_LEAD_ASSISTANT_MODEL_TIMEOUT_MS:4000}
      keep-alive: ${AROORAA_LEAD_ASSISTANT_MODEL_KEEP_ALIVE:30m}
      failure-threshold: ${AROORAA_LEAD_ASSISTANT_MODEL_FAILURE_THRESHOLD:3}
      cooldown-seconds: ${AROORAA_LEAD_ASSISTANT_MODEL_COOLDOWN_SECONDS:60}
      warm-up-on-startup: ${AROORAA_LEAD_ASSISTANT_MODEL_WARM_UP_ON_STARTUP:true}
  # WhatsApp Cloud API transport (ops/whatsapp-integration.md). Everything OFF by default.
  # enabled: webhook GET/POST at /api/v1/whatsapp/webhook (404 when off) + inbound processing.
  # outbound-enabled: actually send replies through https://graph.facebook.com (fixed host).
  # worker.enabled: run the scheduled inbox processor / outbox dispatcher.
  # Credentials come only from the environment / a secrets manager — never commit values.
  # Startup fails (without printing values) if a switch is on and its settings are invalid.
  whatsapp:
    enabled: ${AROORAA_WHATSAPP_ENABLED:false}
    outbound-enabled: ${AROORAA_WHATSAPP_OUTBOUND_ENABLED:false}
    app-secret: ${AROORAA_WHATSAPP_APP_SECRET:}
    verify-token: ${AROORAA_WHATSAPP_VERIFY_TOKEN:}
    access-token: ${AROORAA_WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${AROORAA_WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${AROORAA_WHATSAPP_BUSINESS_ACCOUNT_ID:}
    # Required explicitly when outbound is on (e.g. the version shown in your Meta app dashboard).
    api-version: ${AROORAA_WHATSAPP_API_VERSION:}
    connect-timeout-ms: ${AROORAA_WHATSAPP_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${AROORAA_WHATSAPP_REQUEST_TIMEOUT_MS:10000}
    worker:
      enabled: ${AROORAA_WHATSAPP_WORKER_ENABLED:false}
      cadence-ms: ${AROORAA_WHATSAPP_WORKER_CADENCE_MS:2000}
      batch-size: ${AROORAA_WHATSAPP_WORKER_BATCH_SIZE:20}
  admin:
    bootstrap-email: ${AROORAA_ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${AROORAA_ADMIN_BOOTSTRAP_PASSWORD:}
    bootstrap-name: ${AROORAA_ADMIN_BOOTSTRAP_NAME:Admin}
    reset-email: ${AROORAA_ADMIN_RESET_EMAIL:}
    reset-password: ${AROORAA_ADMIN_RESET_PASSWORD:}
    reset-name: ${AROORAA_ADMIN_RESET_NAME:Admin}
    login-rate-limit:
      max-attempts: ${AROORAA_ADMIN_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-minutes: ${AROORAA_ADMIN_LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # spring-boot-starter-mail on the classpath auto-registers a mail health indicator that
    # tries to connect to spring.mail.host — with notifications intentionally disabled and no
    # SMTP configured (W4.4/W4.5), that check fails and drags the whole /actuator/health (and
    # this container's Docker healthcheck) to DOWN even though the application itself is fine.
    mail:
      enabled: false

logging:
  level:
    com.arooraa.leads: INFO
